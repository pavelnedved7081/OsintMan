[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osintman"
version = "0.1.0"
description = "Passive, public-source media-monitoring OSINT CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OsintMan" }]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "feedparser>=6.0",
  "tenacity>=8.2",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "hatchling>=1.20",
]

[project.scripts]
osintman = "osintman.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/osintman"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
